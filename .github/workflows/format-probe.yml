name: Format probe

on:
  push:
    branches:
      - agent/6.4-core-capabilities

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black==24.10.0
      - run: black --diff src/PermutiveAPI/async_client.py src/PermutiveAPI/tools.py
