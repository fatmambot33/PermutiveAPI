name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Release metadata
        run: python scripts/validate_release_metadata.py
      - name: Typing scope
        run: python scripts/validate_typing_scope.py
      - name: Scenario evidence
        run: python scripts/validate_scenario_evidence.py
      - name: Capability contract
        run: python scripts/validate_capability_contract.py
      - name: Executable recipes
        run: python scripts/validate_recipes.py
      - name: First success
        run: python scripts/validate_first_success.py
      - name: Evaluation scorecard
        run: python scripts/generate_evaluation_scorecard.py --check evals/scorecard.json
      - name: Format
        run: black --check --diff src tests typing_examples scripts
      - name: Docstrings
        run: pydocstyle src/PermutiveAPI
      - name: Types
        run: pyright
      - name: Downstream types
        run: pyright typing_examples/downstream.py
      - name: Compile examples
        run: python -m compileall -q src tests scripts typing_examples

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q --cov-fail-under=70

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and source package
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e .
      - run: python scripts/validate_release_metadata.py
      - run: python scripts/validate_typing_scope.py
      - run: python scripts/validate_scenario_evidence.py
      - run: python scripts/validate_capability_contract.py
      - run: python scripts/validate_recipes.py
      - run: python scripts/validate_first_success.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify core, CLI, plugin, evaluations, capabilities, and first success
        shell: bash
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/permutiveapi-core
          /tmp/permutiveapi-core/bin/pip install "$wheel"
          /tmp/permutiveapi-core/bin/python -c "import PermutiveAPI; print(PermutiveAPI.__all__)"
          /tmp/permutiveapi-core/bin/permutiveapi validate
          /tmp/permutiveapi-core/bin/permutiveapi examples --json > /tmp/permutiveapi-recipes.json
          /tmp/permutiveapi-core/bin/python -c 'import json; assert len(json.load(open("/tmp/permutiveapi-recipes.json"))) >= 7'
          /tmp/permutiveapi-core/bin/python -m PermutiveAPI.first_success
          /tmp/permutiveapi-core/bin/permutiveapi eval > /tmp/permutiveapi-scorecard.json
          /tmp/permutiveapi-core/bin/python -c 'import json; assert json.load(open("/tmp/permutiveapi-scorecard.json"))["summary"]["ok"]'
          /tmp/permutiveapi-core/bin/python -c 'from PermutiveAPI import CapabilityRequirement, ToolRegistry; ToolRegistry().negotiate(CapabilityRequirement(interfaces=("tool_registry",)))'
      - name: Verify async extra and recipe
        shell: bash
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/permutiveapi-async
          /tmp/permutiveapi-async/bin/pip install "${wheel}[async]"
          /tmp/permutiveapi-async/bin/python -c 'from PermutiveAPI.recipes import find_recipes; recipe=find_recipes(name="async-workspace-inspection")[0]; namespace={"__name__":"recipe_async"}; exec(compile(recipe.source, recipe.name, "exec"), namespace); assert namespace["main"]()["id"] == "async-demo"'
      - name: Verify dataframe extra install
        shell: bash
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/permutiveapi-dataframe
          /tmp/permutiveapi-dataframe/bin/pip install "${wheel}[dataframe]"
          /tmp/permutiveapi-dataframe/bin/python -c "import pandas; import PermutiveAPI"
