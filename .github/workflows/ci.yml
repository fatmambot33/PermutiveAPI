# Required PR and agent-branch checks.
name: Python CI

on:
  push:
    branches: ["agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Typing scope
        run: python scripts/validate_typing_scope.py
      - name: Format
        run: black --check --diff src tests typing_examples scripts
      - name: Docstrings
        run: pydocstyle src/PermutiveAPI
      - name: Types
        run: pyright
      - name: Downstream types
        run: pyright typing_examples/downstream.py
      - name: Compile examples
        run: python -m compileall -q src tests scripts typing_examples

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: pytest -q --cov-fail-under=70

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed core surface
        shell: bash
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/permutiveapi-core
          /tmp/permutiveapi-core/bin/pip install "$wheel"
          /tmp/permutiveapi-core/bin/python -c "import PermutiveAPI; print(PermutiveAPI.__all__)"
          /tmp/permutiveapi-core/bin/python -c 'import importlib; [importlib.import_module(name) for name in ("PermutiveAPI.consolidation", "PermutiveAPI.integration_registry", "PermutiveAPI.public_surface", "PermutiveAPI.resource_registry")]'
          /tmp/permutiveapi-core/bin/permutiveapi validate
          /tmp/permutiveapi-core/bin/permutiveapi examples --json > /tmp/permutiveapi-recipes.json
          /tmp/permutiveapi-core/bin/python -c 'import json; assert len(json.load(open("/tmp/permutiveapi-recipes.json"))) >= 7'
          /tmp/permutiveapi-core/bin/python -m PermutiveAPI.first_success
          /tmp/permutiveapi-core/bin/permutiveapi eval > /tmp/permutiveapi-scorecard.json
          /tmp/permutiveapi-core/bin/python -c 'import json; assert json.load(open("/tmp/permutiveapi-scorecard.json"))["summary"]["ok"]'
          /tmp/permutiveapi-core/bin/python -c 'from PermutiveAPI import API_CONTRACT_VERSION, AtomicCredentials, CapabilityRequirement, RateLimitCoordinator, Recording, ToolRegistry; assert API_CONTRACT_VERSION == 1; assert AtomicCredentials("key").generation == 1; assert RateLimitCoordinator(10).reserve_delay() >= 0; ToolRegistry().negotiate(CapabilityRequirement(interfaces=("tool_registry",))); assert Recording(())'
      - name: Verify optional extras
        shell: bash
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/permutiveapi-async
          /tmp/permutiveapi-async/bin/pip install "${wheel}[async]"
          /tmp/permutiveapi-async/bin/python -c 'from PermutiveAPI.recipes import find_recipes; recipe=find_recipes(name="async-workspace-inspection")[0]; namespace={"__name__":"recipe_async"}; exec(compile(recipe.source, recipe.name, "exec"), namespace); assert namespace["main"]()["id"] == "async-demo"'
          python -m venv /tmp/permutiveapi-dataframe
          /tmp/permutiveapi-dataframe/bin/pip install "${wheel}[dataframe]"
          /tmp/permutiveapi-dataframe/bin/python -c "import pandas; import PermutiveAPI"

  ci:
    name: ci
    if: ${{ always() }}
    needs: [lint, tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI
        shell: bash
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "tests=${{ needs.tests.result }}"
          echo "package=${{ needs.package.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
