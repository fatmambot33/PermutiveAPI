# Publishes each package version once through PyPI Trusted Publishing and creates matching immutable release evidence.
name: Release Python package

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md
      - .github/workflows/python-publish.yml
  workflow_dispatch:

concurrency:
  group: release-python-package
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_IMPORT: PermutiveAPI

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.version.outputs.project }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.pypi.outputs.published }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          print(f"project={project['name']}")
          print(f"version={project['version']}")
          print(f"tag=v{project['version']}")
          PY
      - name: Check whether the version is already on PyPI
        id: pypi
        env:
          PROJECT: ${{ steps.version.outputs.project }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          project = urllib.parse.quote(os.environ["PROJECT"], safe="")
          url = f"https://pypi.org/pypi/{project}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  payload = {"releases": {}}
              else:
                  raise

          published = os.environ["VERSION"] in payload.get("releases", {})
          print(f"published={str(published).lower()}")
          PY

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling and source package
        run: |
          python -m pip install --upgrade build twine cyclonedx-bom
          python -m pip install -e .
      - name: Validate release candidate source contracts
        run: |
          python scripts/validate_release_metadata.py
          python scripts/generate_api_contracts.py --check
          python scripts/validate_recordings.py
          python scripts/validate_performance.py
      - name: Build and validate distributions
        run: |
          python -m build --outdir release-dist
          python -m twine check release-dist/*
      - name: Install and smoke test release wheel
        env:
          PROJECT: ${{ needs.check.outputs.project }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python -m venv .venv-release
          .venv-release/bin/python -m pip install --upgrade pip
          .venv-release/bin/python -m pip install release-dist/*.whl
          .venv-release/bin/python - <<'PY'
          import importlib
          import os
          from importlib.metadata import version

          package = importlib.import_module(os.environ["PACKAGE_IMPORT"])
          assert version(os.environ["PROJECT"]) == os.environ["VERSION"]
          assert package.API_CONTRACT_VERSION == 1
          assert package.RELEASE_EVIDENCE_VERSION == 1
          PY
          .venv-release/bin/permutiveapi --help >/dev/null
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p release-evidence
          cyclonedx-py environment .venv-release/bin/python \
            --pyproject pyproject.toml \
            --output-format JSON \
            --output-reproducible \
            --output-file release-evidence/sbom.cdx.json
      - name: Build and verify immutable release manifest
        env:
          PROJECT: ${{ needs.check.outputs.project }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python scripts/build_release_manifest.py \
            --project "$PROJECT" \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --root . \
            --output release-evidence/release-manifest.json \
            release-dist/* release-evidence/sbom.cdx.json
          python scripts/verify_release_manifest.py \
            release-evidence/release-manifest.json --root .
      - name: Attest package distributions
        uses: actions/attest@v4
        with:
          subject-path: "release-dist/*"
      - name: Attest release evidence
        uses: actions/attest@v4
        with:
          subject-path: "release-evidence/*"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/

  publish:
    needs: [check, build]
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - name: Verify exact candidate before publication
        run: |
          python -m pip install -e .
          python scripts/verify_release_manifest.py \
            release-evidence/release-manifest.json --root .
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist

  release:
    needs: [check, build, publish]
    if: ${{ always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - name: Verify exact candidate before release creation
        run: |
          python -m pip install -e .
          python scripts/verify_release_manifest.py \
            release-evidence/release-manifest.json --root .
      - name: Create or reconcile version release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          PUBLISHED: ${{ needs.check.outputs.published }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              if [ "$PUBLISHED" = "true" ]; then
                echo "$TAG is already an immutable published release at $tag_commit."
                exit 0
              fi
              echo "Existing tag $TAG points to $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "${{ needs.check.outputs.project }} $VERSION"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-dist/* release-evidence/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              release-dist/* \
              release-evidence/*
          fi
