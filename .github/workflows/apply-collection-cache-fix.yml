name: Apply collection cache fix

on:
  push:
    branches: [feat/collection-lookups]
    paths:
      - .github/workflows/apply-collection-cache-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/collection-lookups
      - name: Apply mutation-safe collection cache fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          list_path = Path("src/PermutiveAPI/utils/list.py")
          list_text = list_path.read_text()
          list_text = list_text.replace(
              "from typing import Any, List, Optional, TypeVar, Union",
              "from typing import Any, Callable, Generic, Iterable, List, Optional, TypeVar, Union",
              1,
          )
          if "class CacheInvalidatingList" not in list_text:
              marker = 'T_co = TypeVar("T_co")\n\n\n'
              cache_class = '''T = TypeVar("T")\n\n\nclass CacheInvalidatingList(List[T], Generic[T]):\n    """Refresh subclass lookup caches after in-place list mutations.\n\n    Subclasses are expected to implement ``_refresh_cache``. Construction uses\n    the normal ``list`` initializer; caches are refreshed only after subsequent\n    mutations.\n    """\n\n    def _refresh_derived_cache(self) -> None:\n        refresh = getattr(self, "_refresh_cache", None)\n        if callable(refresh):\n            refresh()\n\n    def append(self, item: T) -> None:\n        """Append an item and refresh derived caches."""\n        super().append(item)\n        self._refresh_derived_cache()\n\n    def extend(self, items: Iterable[T]) -> None:\n        """Extend the list and refresh derived caches."""\n        super().extend(items)\n        self._refresh_derived_cache()\n\n    def insert(self, index: int, item: T) -> None:\n        """Insert an item and refresh derived caches."""\n        super().insert(index, item)\n        self._refresh_derived_cache()\n\n    def remove(self, item: T) -> None:\n        """Remove an item and refresh derived caches."""\n        super().remove(item)\n        self._refresh_derived_cache()\n\n    def pop(self, index: int = -1) -> T:\n        """Pop an item and refresh derived caches."""\n        item = super().pop(index)\n        self._refresh_derived_cache()\n        return item\n\n    def clear(self) -> None:\n        """Clear the list and refresh derived caches."""\n        super().clear()\n        self._refresh_derived_cache()\n\n    def reverse(self) -> None:\n        """Reverse the list and refresh derived caches."""\n        super().reverse()\n        self._refresh_derived_cache()\n\n    def sort(\n        self,\n        *,\n        key: Optional[Callable[[T], Any]] = None,\n        reverse: bool = False,\n    ) -> None:\n        """Sort the list and refresh derived caches."""\n        super().sort(key=key, reverse=reverse)\n        self._refresh_derived_cache()\n\n    def __setitem__(self, index: Any, value: Any) -> None:\n        super().__setitem__(index, value)\n        self._refresh_derived_cache()\n\n    def __delitem__(self, index: Any) -> None:\n        super().__delitem__(index)\n        self._refresh_derived_cache()\n\n    def __iadd__(self, items: Iterable[T]):\n        result = super().__iadd__(items)\n        self._refresh_derived_cache()\n        return result\n\n    def __imul__(self, count: int):\n        result = super().__imul__(count)\n        self._refresh_derived_cache()\n        return result\n\n\n'''
              if marker not in list_text:
                  raise SystemExit("TypeVar marker not found in list.py")
              list_text = list_text.replace(marker, marker + cache_class, 1)
          if '"CacheInvalidatingList"' not in list_text:
              list_text = list_text.replace(
                  '__all__ = [\n', '__all__ = [\n    "CacheInvalidatingList",\n', 1
              )
          list_path.write_text(list_text)

          replace_once(
              "src/PermutiveAPI/cohort.py",
              "from .utils.json import JSONSerializable, load_json_list\n",
              "from .utils.json import JSONSerializable, load_json_list\nfrom .utils.list import CacheInvalidatingList\n",
          )
          replace_once(
              "src/PermutiveAPI/cohort.py",
              "class CohortList(List[Cohort], JSONSerializable[List[Any]]):",
              "class CohortList(CacheInvalidatingList[Cohort], JSONSerializable[List[Any]]):",
          )

          replace_once(
              "src/PermutiveAPI/audience/imports.py",
              "from ..utils.json import JSONSerializable, load_json_list\n",
              "from ..utils.json import JSONSerializable, load_json_list\nfrom ..utils.list import CacheInvalidatingList\n",
          )
          replace_once(
              "src/PermutiveAPI/audience/imports.py",
              "class ImportList(List[Import], JSONSerializable[List[Any]]):",
              "class ImportList(CacheInvalidatingList[Import], JSONSerializable[List[Any]]):",
          )
          replace_once(
              "src/PermutiveAPI/audience/imports.py",
              "                self._identifier_dictionary_cache[identifier].append(_import)",
              "                list.append(self._identifier_dictionary_cache[identifier], _import)",
          )

          replace_once(
              "src/PermutiveAPI/audience/segment.py",
              "from ..utils.json import JSONSerializable, load_json_list\n",
              "from ..utils.json import JSONSerializable, load_json_list\nfrom ..utils.list import CacheInvalidatingList\n",
          )
          replace_once(
              "src/PermutiveAPI/audience/segment.py",
              "class SegmentList(List[Segment], JSONSerializable[List[Any]]):",
              "class SegmentList(CacheInvalidatingList[Segment], JSONSerializable[List[Any]]):",
          )

          replace_once(
              "src/PermutiveAPI/workspace.py",
              "from .utils.json import JSONSerializable, load_json_list\n",
              "from .utils.json import JSONSerializable, load_json_list\nfrom .utils.list import CacheInvalidatingList\n",
          )
          replace_once(
              "src/PermutiveAPI/workspace.py",
              "class WorkspaceList(List[Workspace], JSONSerializable[List[Any]]):",
              "class WorkspaceList(CacheInvalidatingList[Workspace], JSONSerializable[List[Any]]):",
          )

          tests_path = Path("tests/test_collection_lookups.py")
          tests_text = tests_path.read_text()
          if "test_collection_lookup_caches_refresh_after_mutations" not in tests_text:
              tests_text += '''\n\ndef test_collection_lookup_caches_refresh_after_mutations() -> None:\n    """Mutable legacy collections keep local lookup indexes current."""\n    cohort_a = Cohort(name="Sports", id="cohort-1", code="101")\n    cohort_b = Cohort(name="News", id="cohort-2", code="202")\n    cohorts = CohortList([cohort_a])\n    cohorts.append(cohort_b)\n    assert cohorts.by_id("cohort-2") is cohort_b\n    cohorts[0] = cohort_b\n    assert cohorts.by_id("cohort-1") is None\n    cohorts.remove(cohort_b)\n    assert cohorts.by_name("News") is None\n\n    source = Source(id="source-1", state={}, type="test")\n    import_a = Import(\n        id="import-1",\n        name="Customers",\n        code="customers",\n        relation="customer",\n        identifiers=["email"],\n        source=source,\n    )\n    import_b = Import(\n        id="import-2",\n        name="Prospects",\n        code="prospects",\n        relation="customer",\n        identifiers=["email"],\n        source=source,\n    )\n    imports = ImportList([import_a])\n    imports.append(import_b)\n    assert imports.by_code("prospects") is import_b\n    imports.remove(import_b)\n    assert imports.by_id("import-2") is None\n\n    segment_a = Segment(\n        code="vip", name="VIP", import_id="import-1", id="segment-1"\n    )\n    segment_b = Segment(\n        code="loyal", name="Loyal", import_id="import-1", id="segment-2"\n    )\n    segments = SegmentList([segment_a])\n    segments.append(segment_b)\n    assert segments.by_name("Loyal") is segment_b\n    segments.remove(segment_b)\n    assert segments.by_code("loyal") is None\n\n    workspace_a = Workspace(\n        name="Main",\n        organisation_id="workspace-1",\n        workspace_id="workspace-1",\n        api_key="test-key",\n    )\n    workspace_b = Workspace(\n        name="Child",\n        organisation_id="workspace-2",\n        workspace_id="workspace-2",\n        api_key="test-key",\n    )\n    workspaces = WorkspaceList([workspace_a])\n    workspaces.append(workspace_b)\n    assert workspaces.by_id("workspace-2") is workspace_b\n    workspaces.remove(workspace_b)\n    assert workspaces.by_name("Child") is None\n'''
          tests_path.write_text(tests_text)
          PY
          rm .github/workflows/apply-collection-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PermutiveAPI tests/test_collection_lookups.py .github/workflows/apply-collection-cache-fix.yml
          git diff --cached --check
          git commit -m "fix: invalidate collection lookup caches"
          git push origin HEAD:feat/collection-lookups
