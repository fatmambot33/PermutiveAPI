name: Codex review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve live base revision
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BASE_REF}" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Run shared current-HEAD Codex review gate
        uses: fatmambot33/ai-native-platform/actions/codex-review-gate@51f82dfc0ae99ad1030ded032df3b724c8b7d0df
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          review-context: ${{ steps.base.outputs.sha }}
          mode: request-and-wait
          check-name: codex-review
