name: AI-native platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical standard
        uses: actions/checkout@v4
        with:
          repository: fatmambot33/ai-native-platform
          ref: c160b627593a08c4cfd6355c9f4744305e154ed2
          path: .ai-native-standard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Validate declarations and repository evidence
        run: python .ai-native-standard/validator/validate.py AI_NATIVE_PLATFORM.yaml --root .
