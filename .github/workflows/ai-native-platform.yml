name: AI-native platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5' 'PyYAML>=6,<7'
      - name: Validate the pinned AI-native contract and repository evidence
        run: python scripts/validate_ai_native_platform.py
      - name: Validate installed product surface
        run: permutiveapi validate
      - name: Run governed-platform evaluations
        run: |
          permutiveapi eval > /tmp/permutiveapi-scorecard.json
          python scripts/generate_evaluation_scorecard.py --check evals/scorecard.json
      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py
