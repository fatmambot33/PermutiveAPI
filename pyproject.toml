[project]
name = "PermutiveAPI"
version = "6.2.0"
description = "A typed Python SDK for the Permutive API."
readme = "README.md"
authors = [{ name = "FaTmamBo33", email = "fatmambo33@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "typing_extensions>=4.8; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dataframe = ["pandas>=2"]
dev = [
    "black>=24",
    "build>=1",
    "pandas>=2",
    "pydocstyle>=6",
    "pyright>=1.1.390",
    "pytest>=8,<9",
    "pytest-cov>=5",
    "pytest-pydocstyle>=2",
    "twine>=5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/PermutiveAPI"]

[tool.hatch.build.targets.wheel]
packages = ["src/PermutiveAPI"]

[tool.hatch.build.targets.sdist]
include = [
    "src/PermutiveAPI",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.black]
target-version = ["py39"]
line-length = 88

[tool.pyright]
include = ["src/PermutiveAPI"]
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --cov=PermutiveAPI --cov-branch --cov-report=term-missing --cov-fail-under=70"
markers = [
    "integration: tests requiring live Permutive credentials",
]
