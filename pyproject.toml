[project]
name = "PermutiveAPI"
version = "6.5.0"
description = "A typed, governed AI-native Python platform for the Permutive API."
readme = "README.md"
authors = [{ name = "FaTmamBo33", email = "fatmambo33@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "typing_extensions>=4.8",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
permutiveapi = "PermutiveAPI.cli:main"

[project.entry-points."permutiveapi.plugins"]
codex = "PermutiveAPI.plugins.codex:CodexPlugin"

[project.optional-dependencies]
async = ["httpx>=0.27"]
dataframe = ["pandas>=2"]
dev = [
    "black==25.11.0",
    "build>=1",
    "hatchling>=1.26",
    "httpx>=0.27",
    "pandas>=2",
    "pydocstyle>=6",
    "pyright>=1.1.390",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-pydocstyle>=2",
    "twine>=5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/PermutiveAPI"]

[tool.hatch.build.targets.wheel]
packages = ["src/PermutiveAPI"]

[tool.hatch.build.targets.sdist]
include = [
    "src/PermutiveAPI",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "ROADMAP.md",
    "PRODUCT.md",
    "AI_NATIVE_PLATFORM.yaml",
    "PUBLIC_API.md",
    "API_COVERAGE.md",
    "MIGRATION.md",
    "RELEASING.md",
    "LICENSE",
]

[tool.black]
target-version = ["py39"]
line-length = 88

[tool.pyright]
include = [
    "src/PermutiveAPI/__init__.py",
    "src/PermutiveAPI/agent.py",
    "src/PermutiveAPI/ai_native.py",
    "src/PermutiveAPI/async_client.py",
    "src/PermutiveAPI/cli.py",
    "src/PermutiveAPI/client.py",
    "src/PermutiveAPI/config.py",
    "src/PermutiveAPI/credentials.py",
    "src/PermutiveAPI/mcp.py",
    "src/PermutiveAPI/models.py",
    "src/PermutiveAPI/plugins",
    "src/PermutiveAPI/query_dsl.py",
    "src/PermutiveAPI/resources.py",
    "src/PermutiveAPI/sdk.py",
    "src/PermutiveAPI/tools.py",
    "src/PermutiveAPI/validation.py",
]
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnsupportedDunderAll = false
reportAttributeAccessIssue = false

[tool.pydocstyle]
convention = "numpy"
add-ignore = "D105"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --cov=PermutiveAPI --cov-branch --cov-report=term-missing --cov-fail-under=70"
markers = [
    "integration: tests requiring live Permutive credentials",
]
