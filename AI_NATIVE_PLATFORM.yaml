version: 1

standard:
  repository: fatmambot33/ai-native-platform
  ref: c160b627593a08c4cfd6355c9f4744305e154ed2

product:
  name: PermutiveAPI
  ai_native: true
  plugin_first: true
  sdk_first: true
  api_first: true
  cli_first: true
  mcp_first: true

plugin:
  enabled: true
  codex:
    supported: true
    marketplace: true
  discovery:
    entry_points: true
    manifest: true
    capabilities: true
  credentials:
    required: true
    local_only: true
    env_file: .env
    env_example: plugins/permutiveapi/.env.example
    required_variables: [PERMUTIVE_API_KEY, PERMUTIVE_WORKSPACE_ID]
    setup_command: permutiveapi configure
    validation_command: permutiveapi doctor
    policy:
      never_store_remote: true
      never_commit: true
      never_echo: true
      require_gitignore: true
      require_local_env: true

commands:
  required: [configure, doctor, validate, test, docs, examples, upgrade, uninstall]
  recommended: [eval, benchmark]

interfaces:
  sdk: true
  cli: true
  plugin: true
  mcp: true
  openai_tools: true
  json_schema: true

quality:
  typed: true
  tests: true
  docs: true
  examples: true
  security_scan: true
  compatibility_tests: true
  ai_evaluations: true
  benchmark: true

self_improvement:
  enabled: true
  github:
    issues: true
  autonomous:
    discover_improvements: true
    create_issues: true
    generate_pr: true
    run_ci: true
    update_roadmap_and_changelog: true
  governance:
    human_approval:
      breaking_changes: true
      security_changes: true
      credential_changes: true
      public_api_changes: true
      permission_expansion: true
      release_changes: true
    safe_auto_merge: [documentation, tests, formatting, examples, non_breaking_maintenance]

release:
  block_if_quality_fails: true
  block_if_doctor_fails: true
  block_if_plugin_invalid: true
  block_if_self_improvement_contract_invalid: true

agent:
  guarantees:
    - local_credentials_only
    - no_remote_secret_storage
    - human_confirmation_for_writes
    - deterministic_tool_discovery
    - structured_outputs
    - issue_driven_improvement
    - ci_validated_changes
    - governed_autonomy
